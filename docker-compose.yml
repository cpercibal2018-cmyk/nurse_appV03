# AIGH Nursing Workforce — runnable full stack.
# One command:  docker compose up --build
#   db  → PostgreSQL 16   (data persisted in the pgdata volume)
#   api → Express + Prisma, pushes schema + seeds on first boot, serves :3001
#   web → React/Vite build served on :5173, talks to the api
#
# Then open http://localhost:5173
# (The detailed spec-grade topology is kept in docker-compose.full-spec.yml.)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nurseapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nurseapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/nurseapp
      PORT: "3001"
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: aigh_local_dev_compose_jwt_secret_min_32_chars_long
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./app
      args:
        VITE_API_URL: http://localhost:3001
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
