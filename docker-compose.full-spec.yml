version: "3.9"

# AIGH Nursing Workforce Management System — Docker Compose
# Spec rev 2.8.7c · §10.2–10.3 deployment topology
# Five services: proxy · api · worker · db · redis

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  APP_ORIGIN: ${APP_ORIGIN}
  JWT_SECRET: ${JWT_SECRET}
  JWT_ACCESS_EXPIRY: 15m
  REFRESH_COOKIE_NAME: nurseapp_refresh
  CSRF_SECRET: ${CSRF_SECRET}
  PDPL_FIELD_ENCRYPTION_KEY: ${PDPL_FIELD_ENCRYPTION_KEY}
  PDPL_BLIND_INDEX_KEY: ${PDPL_BLIND_INDEX_KEY}
  SCFHS_BASE_URL: ${SCFHS_BASE_URL}
  SCFHS_MTLS_CERT: ${SCFHS_MTLS_CERT}
  SCFHS_MTLS_KEY: ${SCFHS_MTLS_KEY}
  STORAGE_BUCKET: ${STORAGE_BUCKET}
  STORAGE_REGION: me-central-1          # KSA residency — Bahrain (me-south-1) NOT allowed
  KSA_REGION_ALLOWLIST: me-central-1    # assertResidencyFromEnv() checks this at boot
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: 587
  SMTP_USER: ${SMTP_USER}
  SMTP_PASS: ${SMTP_PASS}
  SMTP_FROM: nurseapp@aigh.sa
  FCM_SERVER_KEY: ${FCM_SERVER_KEY}

services:

  # ── Reverse proxy ─────────────────────────────────────
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - public
      - internal

  # ── API server (HTTP only — no schedulers) ────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    command: node dist/main.js
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      <<: *api-env
      ENABLE_SCHEDULER: "false"   # schedulers run in worker only
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health/live').then(r=>process.exit(r.ok?0:1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - internal

  # ── Worker (cron jobs only — no HTTP listener) ────────
  # 7 jobs: daily_scan · smtp_queue · scfhs_sync · grace_expiry
  #         idempotency_cleanup · backup_freshness · quarantine_scan
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    command: node dist/main-worker.js
    restart: unless-stopped
    environment:
      <<: *api-env
      ENABLE_SCHEDULER: "true"
      WORKER_ID: ${WORKER_ID:-worker-1}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  # ── PostgreSQL 15 ─────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nurseapp}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-nurseapp_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # role creation + grant scripts
      - ./db/wal-archive:/wal-archive               # WAL archiving target
    command: >
      postgres
        -c archive_mode=on
        -c archive_command='cp %p /wal-archive/%f'
        -c archive_timeout=300
        -c wal_level=replica
        -c max_wal_senders=3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OWNER_USER:-nurseapp_owner} -d ${POSTGRES_DB:-nurseapp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Redis 7 ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  pgdata:
  redisdata:

networks:
  public:
  internal:
    internal: true   # api/worker/db/redis — not reachable from host directly
